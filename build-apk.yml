name: Build Notula APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cari folder proyek (berisi package.json)
        id: proj
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            found=$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -n1)
            if [ -z "$found" ]; then
              echo "::error::package.json tidak ditemukan. Pastikan berkas proyek sudah terunggah."
              exit 1
            fi
            echo "dir=$(dirname "$found")" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ${{ steps.proj.outputs.dir }}
        run: npm install

      - name: Add Android platform (lewati bila sudah ada)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ -d android ]; then echo "android/ sudah ada — lewati"; else npx cap add android; fi

      - name: Patch AndroidManifest (izin mikrofon, foreground service, wake lock)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: node scripts/patch-android.mjs

      - name: Sync web assets
        working-directory: ${{ steps.proj.outputs.dir }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notula-debug-apk
          path: ${{ steps.proj.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
